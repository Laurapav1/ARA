services:
  db:
    image: postgres:17.5
    environment:
      POSTGRES_USER: ara_user
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: ara_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ara_user -d ara_db"]
      interval: 5s
      timeout: 2s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: Ara.Api
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=ara_db;Username=ara_user;Password=supersecret"
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__Key: ${JWT_KEY}
    ports:
      - "8080:8080"

  pgadmin:
    image: dpage/pgadmin4:9.6
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: always

volumes:
  db_data:
  pgadmin_data:
